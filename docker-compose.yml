# Local development: `make dev` (or `docker compose up --build`).
#
#   web  http://localhost:3000   Next.js dev server (proxies /api/v1 to api)
#   api  http://localhost:8000   FastAPI with autoreload (docs at /docs)
#   db   localhost:5432          Postgres 16 (postgres/postgres, database "weather")
#
# Uses the mock forecast provider, so no Google credentials are needed.
name: weather-app

x-api-env: &api-env
  ENVIRONMENT: development
  DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/weather
  FORECAST_PROVIDER: ${FORECAST_PROVIDER:-mock}
  GEOCODER_PROVIDER: ${GEOCODER_PROVIDER:-nominatim}
  NWS_USER_AGENT: ${NWS_USER_AGENT:-weathernext-personal-weather-app (dev@example.com)}
  COOKIE_SECRET: ${COOKIE_SECRET:-dev-only-insecure-cookie-secret-change-me}
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  INGESTION_BACKFILL_RUNS: ${INGESTION_BACKFILL_RUNS:-8}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weather
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weather"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: { context: ., dockerfile: workers/forecast-ingestion/Dockerfile }
    command: ["migrate"]
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment: *api-env
    command: ["uvicorn", "weather_api.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/apps/api/src"]
    # The image installs weather_api non-editable; mount the source over the
    # installed package for live reload.
    volumes:
      - ./apps/api/src/weather_api:/app/.venv/lib/python3.12/site-packages/weather_api
      - ./apps/api/src:/app/apps/api/src
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Stand-in for Cloud Scheduler + Cloud Run Job: ingest the latest mock run
  # every hour. Idempotent, so frequent runs are harmless.
  ingest:
    build: { context: ., dockerfile: workers/forecast-ingestion/Dockerfile }
    entrypoint: ["sh", "-c", "while true; do forecast-ingestion run; sleep 3600; done"]
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -w @weather/web -- --hostname 0.0.0.0 --port 3000"]
    environment:
      API_ORIGIN: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
      - web_next:/app/apps/web/.next
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  web_node_modules:
  web_app_node_modules:
  web_next:
