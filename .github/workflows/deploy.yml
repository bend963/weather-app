# Deploys the API (Cloud Run service) and the ingestion worker (Cloud Run Job)
# on every push to main. The web app is deployed by Vercel's Git integration.
#
# One-time setup: infra/cloud-run/bootstrap.sh, then the repository variables
# and secrets listed in infra/github/README.md.
name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation: no long-lived JSON keys

jobs:
  deploy:
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPO: ${{ vars.GCP_ARTIFACT_REPO }}
      FORECAST_PROVIDER: ${{ vars.FORECAST_PROVIDER || 'mock' }}
      GEOCODER_PROVIDER: ${{ vars.GEOCODER_PROVIDER || 'nominatim' }}
      WEATHERNEXT_BIGQUERY_DATASET: ${{ vars.WEATHERNEXT_BIGQUERY_DATASET }}
      NWS_USER_AGENT: ${{ vars.NWS_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push images
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          REGISTRY="$REGION-docker.pkg.dev/$PROJECT/$REPO"
          docker build -f apps/api/Dockerfile -t "$REGISTRY/weather-api:$GITHUB_SHA" .
          docker build -f workers/forecast-ingestion/Dockerfile -t "$REGISTRY/forecast-ingestion:$GITHUB_SHA" .
          docker push "$REGISTRY/weather-api:$GITHUB_SHA"
          docker push "$REGISTRY/forecast-ingestion:$GITHUB_SHA"

      - name: Run database migrations
        run: infra/cloud-run/deploy.sh migrate "$GITHUB_SHA"

      - name: Deploy API service
        run: infra/cloud-run/deploy.sh api "$GITHUB_SHA"
        env:
          WEB_ORIGINS: ${{ vars.WEB_ORIGINS }}

      - name: Deploy ingestion job
        run: infra/cloud-run/deploy.sh worker "$GITHUB_SHA"
