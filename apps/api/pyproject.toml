[project]
name = "weather-api"
version = "0.1.0"
description = "FastAPI service and shared forecast domain code for the WeatherNext personal weather app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "timezonefinder>=6.5",
    "httpx>=0.28",
]

[project.optional-dependencies]
weathernext = ["google-cloud-bigquery>=3.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:logging"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
